name: tests

# The suite takes 19 seconds and was running only when someone remembered to
# run it. Twice in one session that someone was luck.
#
# Every branch, not just master: the work in this project happens on branches
# like beta-5.1-guardrail-and-latency and merges after review, so a check that
# only ran on master would report on code that had already landed.
on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Windows regression suite - v0.2.0-beta.6
    # Windows because that is what the beta ships as, and because the five
    # modules carrying platform branches -- health_check, config,
    # system_awareness, ui, spotify_control -- take their Windows path here.
    # A Linux job would exercise the Raspberry Pi target instead; that is
    # worth adding, but it has not been run yet and is not asserted here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 3.14 matches the bundled embeddable interpreter the installer ships.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Only setup/requirements.txt. The suite is hermetic: it mocks
      # start_server, and the voice and audio stacks are imported lazily
      # inside the functions that use them, so sherpa-onnx, piper and the
      # GGUF weights are not needed to run it. The exact full-suite count is
      # verified and recorded at release after the final source freeze.
      - name: Install base dependencies
        run: python -m pip install -r setup/requirements.txt

      # assistant/ as the working directory, matching setup/test_assistant.bat.
      # PYTHONIOENCODING because the console this project targets is cp1252 and
      # the suite prints characters that raise UnicodeEncodeError without it.
      - name: Run the full Beta 6 regression suite
        working-directory: assistant
        env:
          PYTHONIOENCODING: utf-8
        run: python run_regressions.py
